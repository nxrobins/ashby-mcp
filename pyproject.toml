[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ashby-connector"
version = "0.1.0"
description = "Model Context Protocol (MCP) server implementation for Ashby ATS integration"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "llm", "ashby", "ats"]
dependencies = [
    # The upper bound is load-bearing, not caution. mcp 2.0.0 removed the
    # Server.list_tools() / Server.call_tool() decorators that server.py applies
    # at MODULE level, so an unpinned resolve raises AttributeError at import —
    # before the server can speak MCP. Clients see only the stdio pipe close
    # ("-32000: Connection closed"), with no hint that a dependency moved, which
    # is why this must be pinned here rather than at each install site.
    # Deliberately an upper bound only, with no floor: downstream deployments
    # install this package alongside their own pinned 1.x mcp (for example via
    # `uv ... --with mcp==1.28.1`), and a floor above that would make those
    # installs unresolvable. Verified working on both 1.28.1 and 1.29.0.
    # Raising the bound requires porting server.py to the 2.x API first.
    "mcp<2",
    "httpx>=0.27",
    "tenacity>=8.0",
    "python-dotenv",
    # Imported directly by transport.py for the HTTP/SSE transport. They also
    # arrive transitively through mcp, but a direct import deserves a direct
    # declaration so a future mcp release can't silently drop them.
    "starlette>=0.27",
    "uvicorn>=0.23",
]
license = { text = "MIT" }
authors = [
    { name = "Nigel Xavier", email = "nigel@disisnotawebsite.com" }
]

[project.urls]
Homepage = "https://github.com/nxrobins/ashby-mcp"

[project.scripts]
ashby-mcp = "ashby:main"

[tool.hatch.build.targets.wheel]
# src-layout: hatch maps `src/ashby` to a top-level `ashby` package in the
# wheel, so `import ashby` works once the project is installed (including
# the editable install `uv sync` performs).
packages = ["src/ashby"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]
evals = [
    "anthropic>=0.39",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that hit the real Ashby API (require ASHBY_API_KEY; skipped otherwise)",
]
testpaths = ["tests"]
