[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ashby-connector"
version = "0.1.0"
description = "Model Context Protocol (MCP) server implementation for Ashby ATS integration"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "llm", "ashby", "ats"]
dependencies = [
    # The upper bound is load-bearing, not caution. mcp 2.0.0 removed the
    # Server.list_tools() / Server.call_tool() decorators that server.py applies
    # at MODULE level (src/ashby/server.py:34), so an unpinned resolve raises
    # AttributeError at import — before the server can speak MCP. Clients see
    # only the stdio pipe close ("-32000: Connection closed"), with no hint that
    # a dependency moved, which is why this must be pinned here rather than at
    # each install site. Deliberately an upper bound only, with no floor: core's
    # apps/chippy/Dockerfile installs this package with `--with mcp==1.28.1`,
    # and a floor above that would make those image builds unresolvable.
    # Verified working on both 1.28.1 and 1.29.0. Raising the bound requires
    # porting server.py to the 2.x API first.
    "mcp<2",
    "httpx>=0.27",
    "tenacity>=8.0",
    "python-dotenv",
]
license = { text = "MIT" }
authors = [
    { name = "Nigel Xavier", email = "nigel@disisnotawebsite.com" }
]

[project.urls]
Homepage = "https://github.com/nxrobins/ashby-mcp"

[project.scripts]
ashby-mcp = "src.ashby:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]
evals = [
    "anthropic>=0.39",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: tests that hit the real Ashby API (require ASHBY_API_KEY; skipped otherwise)",
]
testpaths = ["tests"]
pythonpath = ["src"]
