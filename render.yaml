# Render blueprint — one-click deploy.
#
# After your repo is on GitHub, point Render at this file:
#   Dashboard → New + → Blueprint → pick the ashby-mcp repo
# Render auto-provisions the service with everything below. You fill in
# ASHBY_API_KEY and MCP_BEARER_TOKEN in the Render UI when prompted
# (both are marked `sync: false` so they're never committed to git).
#
# MCP_BEARER_TOKEN is not optional: the server refuses to start on
# 0.0.0.0 without one, so a deploy that skips it fails its health check
# instead of coming up open. Optional hardening (add under envVars, see
# README → "Security note"):
#   ASHBY_READ_ONLY=1   — reporting-only deployment, no write tools
#   ASHBY_UPLOAD_DIR    — re-enables the upload tools, confined to that dir
#
# Dependencies are installed from uv.lock, not resolved fresh at build time.
# The previous `pip install -e .` ignored the lock, so every deploy floated to
# whatever mcp/starlette/uvicorn was newest that day while the test suite ran
# against the locked versions — the `mcp<2` pin in pyproject.toml exists
# because one such float broke the server at import. Now:
#   - `uv sync --frozen --no-dev` installs exactly the locked versions (the
#     same set CI tests and runs pip-audit against) and leaves the test
#     tooling out of the image. uv reuses Render's existing `.venv`, so the
#     `uv` binary that pip put there survives into the start command.
#   - `uv run --no-sync ashby-mcp` starts the console script from that
#     environment without re-resolving anything at boot.
# To ship a dependency upgrade, run `uv lock --upgrade` locally, get CI green,
# and merge — the lock is the only thing that moves what production runs.
services:
  - type: web
    name: ashby-mcp
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync ashby-mcp
    healthCheckPath: /healthz
    envVars:
      - key: MCP_TRANSPORT
        value: http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ASHBY_API_KEY
        sync: false   # Set in Render UI — your Ashby team API key
      - key: MCP_BEARER_TOKEN
        sync: false   # Set in Render UI — a long random token (e.g. `openssl rand -hex 24`)
